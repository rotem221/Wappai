; Piko firmware - Waveshare ESP32-S3-Touch-AMOLED-1.75
;   pio run -t upload        build + flash over USB
;   pio device monitor       serial console (115200)
; tools/build.sh does gen_face + secrets + build in one go.

[env:amoled175]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB          ; the chip has 32MB; the first 16MB are used (like the factory firmware)
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600
upload_flags = --before=usb-reset
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -O2
build_unflags = -Os
lib_deps =
  https://github.com/lovyan03/LovyanGFX.git#1.2.36
  https://github.com/bblanchon/ArduinoJson.git#v7.4.3
  https://github.com/Links2004/arduinoWebSockets.git#2.7.2
